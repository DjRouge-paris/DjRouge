<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ Rouge — Booking</title>
<meta name="description" content="DJ Rouge — musica per club, matrimoni ed eventi. Prenota su Linkaband.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF3E6;
    --bg-2:#F1E6D2;
    --bg-3:#E8D9BC;
    --ink:#3B2A18;
    --ink-dim:#7A6A52;
    --oak:#A5774D;
    --tiger:#C88141;
    --fusion:#85754E;
    --tomato:#E23C22;
    --line: rgba(59,42,24,0.14);
    --radius: 2px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#FAF3E6; --bg-2:#F1E6D2; --bg-3:#E8D9BC; --ink:#3B2A18; --ink-dim:#7A6A52;
      --oak:#A5774D; --tiger:#C88141; --fusion:#85754E; --tomato:#E23C22; --line: rgba(59,42,24,0.14);
    }
  }
  :root[data-theme="dark"]{
    --bg:#FAF3E6; --bg-2:#F1E6D2; --bg-3:#E8D9BC; --ink:#3B2A18; --ink-dim:#7A6A52;
    --oak:#A5774D; --tiger:#C88141; --fusion:#85754E; --tomato:#E23C22; --line: rgba(59,42,24,0.14);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 900px 500px at 88% -5%, rgba(226,60,34,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at -10% 45%, rgba(133,117,78,0.10), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    font-weight:400;
    line-height:1.6;
    overflow-x:hidden;
  }
  a{color:inherit;}
  img,svg{max-width:100%;display:block;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 28px;}
  @media (max-width:640px){ .wrap{padding:0 20px;} }

  h1,h2,h3{font-family:'Unbounded', sans-serif; margin:0; letter-spacing:-0.01em;}

  header.nav{
    position:fixed; top:0; left:0; right:0; z-index:50;
    background:rgba(250,243,230,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px; max-width:1180px; margin:0 auto; gap:20px;
  }
  .brandmark{
    font-family:'Unbounded'; font-weight:800; font-size:1.05rem;
    letter-spacing:0.02em; color:var(--ink); text-decoration:none; white-space:nowrap;
  }
  .brandmark span{color:var(--tomato);}
  nav.links{display:flex; gap:26px; align-items:center;}
  nav.links a{
    text-decoration:none; color:var(--ink-dim); font-size:0.92rem; font-weight:500;
    transition:color .2s ease;
  }
  nav.links a:hover{color:var(--ink);}
  .book-btn{
    background:var(--tomato); color:#FBF3E7; padding:10px 20px; border-radius:var(--radius);
    font-weight:700; font-size:0.88rem; text-decoration:none; border:1px solid var(--tomato);
    transition:background .2s ease, color .2s ease;
  }
  .book-btn:hover{background:transparent; color:var(--tomato); border-color:var(--tomato);}
  .lang-switch{ display:flex; gap:2px; border:1px solid var(--line); border-radius:999px; padding:3px; }
  .lang-switch button{
    background:none; border:none; cursor:pointer; font-family:'Manrope'; font-weight:700;
    font-size:0.76rem; letter-spacing:0.03em; padding:6px 11px; border-radius:999px; color:var(--ink-dim);
    transition:background .2s ease, color .2s ease;
  }
  .lang-switch button.active{ background:var(--tiger); color:#FBF3E7; }
  .menu-btn{display:none; background:none; border:none; color:var(--ink); font-size:1.6rem; cursor:pointer;}
  @media (max-width: 900px){
    nav.links{
      position:fixed; top:60px; right:0; left:0; background:var(--bg-2);
      flex-direction:column; align-items:flex-start; gap:0; padding:8px 28px 20px;
      border-bottom:1px solid var(--line);
      transform:translateY(-140%); transition:transform .3s ease; visibility:hidden;
    }
    nav.links.open{transform:translateY(0); visibility:visible;}
    nav.links a{padding:12px 0; width:100%; border-bottom:1px solid var(--line);}
    nav.links .book-btn{margin-top:14px; text-align:center;}
    .menu-btn{display:block;}
  }

  .hero{ position:relative; padding:150px 0 60px; overflow:hidden; }
  .hero-grid{ display:grid; grid-template-columns:1.1fr 0.9fr; gap:40px; align-items:center; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:10px;
    color:var(--tiger); font-size:0.82rem; font-weight:700; letter-spacing:0.04em;
    margin-bottom:22px;
  }
  .eyebrow::before{content:""; width:26px; height:1px; background:var(--tiger);}
  .hero-title{
    font-size:clamp(3.4rem, 9vw, 6.4rem);
    font-weight:900; line-height:0.92; color:var(--ink);
    margin:0 0 22px;
  }
  .hero-title em{ font-style:normal; color:var(--tomato); }
  .hero-sub{ max-width:480px; color:var(--ink-dim); font-size:1.08rem; margin-bottom:34px; }
  .hero-cta{display:flex; gap:16px; flex-wrap:wrap;}
  .cta-primary{
    background:var(--tomato); color:#FBF3E7; padding:15px 28px; border-radius:var(--radius);
    text-decoration:none; font-weight:700; border:1px solid var(--tomato);
    transition:transform .2s ease, background .2s ease, color .2s ease;
    display:inline-block;
  }
  .cta-primary:hover{transform:translateY(-2px); background:transparent; color:var(--tomato);}
  .cta-secondary{
    color:var(--ink); padding:15px 8px; text-decoration:none; font-weight:600;
    border-bottom:1px solid var(--line); align-self:center;
  }
  .cta-secondary:hover{border-color:var(--ink);}

  .hero-visual{ position:relative; }
  .disc{ width:100%; max-width:380px; margin:0 auto; aspect-ratio:1/1; animation: spin 22s linear infinite; }
  @media (prefers-reduced-motion: reduce){ .disc{animation:none;} }
  .disc svg{width:100%; height:100%;}
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .ticker-wrap{
    border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    background:var(--bg-2); overflow:hidden; margin-top:70px;
  }
  .ticker{ display:flex; white-space:nowrap; padding:14px 0; animation: ticker 26s linear infinite; }
  @media (prefers-reduced-motion: reduce){ .ticker{animation:none; flex-wrap:wrap;} }
  .ticker span{
    font-family:'Unbounded'; font-size:0.95rem; font-weight:600; letter-spacing:0.02em;
    color:var(--ink-dim); padding:0 26px; border-right:1px solid var(--line);
  }
  .ticker span b{color:var(--fusion); font-weight:600;}
  @keyframes ticker{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  section{padding:96px 0;}
  .section-head{ max-width:640px; margin-bottom:52px; }
  .section-tag{ color:var(--tiger); font-weight:700; font-size:0.86rem; letter-spacing:0.03em; margin-bottom:10px; display:block;}
  .section-title{ font-size:clamp(1.9rem, 4vw, 2.7rem); font-weight:800; }
  .section-title .accent{color:var(--tomato);}
  .section-lead{ color:var(--ink-dim); margin-top:16px; font-size:1.03rem; max-width:560px;}

  .bio{ background:var(--bg-2); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .bio-grid{ display:grid; grid-template-columns:0.85fr 1.15fr; gap:64px; align-items:center;}
  .bio-figure{ border:1px solid var(--line); background:var(--bg-3); overflow:hidden; aspect-ratio:3/4; }
  .bio-figure svg{width:100%; height:auto;}
  .bio-figure img{ width:100%; height:100%; object-fit:cover; display:block; }
  .bio-quote{ font-family:'Unbounded'; font-size:1.5rem; line-height:1.35; font-weight:600; color:var(--oak); margin-bottom:22px; }
  .bio-text p{ color:var(--ink-dim); margin:0 0 16px; max-width:560px;}
  .bio-stats{ display:flex; gap:40px; margin-top:30px; flex-wrap:wrap;}
  .stat b{ display:block; font-family:'Unbounded'; font-size:1.8rem; color:var(--tomato); font-weight:800;}
  .stat span{ color:var(--ink-dim); font-size:0.86rem;}

  @media (max-width: 860px){
    .hero-grid, .bio-grid{ grid-template-columns:1fr; }
    .hero-visual{ order:-1; margin-bottom:20px; max-width:240px;}
  }

  .genre-flow{ display:flex; flex-wrap:wrap; gap:14px; }
  .genre-pill{
    border:1px solid var(--line); padding:12px 22px; border-radius:999px;
    font-size:0.95rem; color:var(--ink); background:var(--bg-2);
  }
  .genre-pill.strong{ border-color:var(--tomato); color:var(--tomato); font-weight:700;}

  .event-list{ border-top:1px solid var(--line);}
  .event-row{ display:grid; grid-template-columns:220px 1fr; gap:30px; padding:34px 0; border-bottom:1px solid var(--line); }
  .event-row h3{ font-size:1.3rem; font-weight:700; color:var(--ink);}
  .event-row .tag{ color:var(--fusion); font-weight:700; font-size:0.85rem; letter-spacing:0.02em;}
  .event-row p{ color:var(--ink-dim); margin:10px 0 0; max-width:560px;}
  @media (max-width:640px){ .event-row{grid-template-columns:1fr; gap:10px;} }

  .dates{ background:var(--bg-2); border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
  .date-row{ display:flex; align-items:center; gap:26px; padding:22px 0; border-bottom:1px solid var(--line); }
  .date-row:last-child{border-bottom:none;}
  .date-badge{ font-family:'Unbounded'; font-weight:800; font-size:1rem; color:var(--oak); min-width:96px; }
  .date-row.next .date-badge{ color:var(--tomato); }
  .date-info h4{ margin:0; font-size:1.05rem; font-weight:600;}
  .date-info span{ color:var(--ink-dim); font-size:0.9rem;}
  .date-row.next{ position:relative; }
  .date-row.next::before{
    content: attr(data-next-label); position:absolute; right:0; top:22px;
    font-size:0.72rem; letter-spacing:0.04em; color:var(--tomato); font-weight:700;
  }
  .note{ color:var(--ink-dim); font-size:0.86rem; margin-top:26px; font-style:italic;}

  .mix-list{ display:flex; flex-direction:column; gap:1px; background:var(--line); }
  .mix-row{ display:flex; align-items:center; gap:20px; padding:24px 26px; background:var(--bg); text-decoration:none; color:var(--ink); }
  .mix-row:hover{ background:var(--bg-2); }
  .play-ring{ width:46px; height:46px; border-radius:50%; border:1px solid var(--tomato); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .play-ring svg{ width:14px; height:14px; fill:var(--tomato); }
  .mix-row h4{ margin:0; font-size:1.02rem; font-weight:700;}
  .mix-row span{ color:var(--ink-dim); font-size:0.86rem;}

  .contact{
    background: radial-gradient(ellipse 700px 400px at 15% 20%, rgba(226,60,34,0.10), transparent 60%), var(--bg-3);
    border-top:1px solid var(--line); text-align:left;
  }
  .contact-grid{ display:grid; grid-template-columns:1.2fr 0.8fr; gap:50px; align-items:start;}
  .contact-title{ font-size:clamp(2.1rem, 5vw, 3.4rem); font-weight:900; line-height:1.03;}
  .contact-title .accent{color:var(--tomato);}
  .contact-text{ color:var(--ink-dim); margin-top:18px; max-width:480px;}
  .contact-actions{ margin-top:34px; display:flex; gap:16px; flex-wrap:wrap;}
  .contact-block{ border-left:1px solid var(--line); padding-left:28px;}
  .contact-block h4{ font-family:'Unbounded'; font-size:0.85rem; letter-spacing:0.03em; color:var(--fusion); margin-bottom:14px; font-weight:700;}
  .contact-line{ display:block; color:var(--ink); text-decoration:none; margin-bottom:12px; font-size:0.98rem;}
  .contact-line:hover{ color:var(--tomato); }
  @media (max-width:860px){ .contact-grid{grid-template-columns:1fr;} .contact-block{border-left:none; padding-left:0; border-top:1px solid var(--line); padding-top:24px;} }

  footer{
    padding:34px 0; border-top:1px solid var(--line); color:var(--ink-dim); font-size:0.85rem;
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px;
  }
  footer a{ color:var(--ink-dim); text-decoration:none; }
  footer a:hover{ color:var(--ink); }
</style>
</head>
<body>

<header class="nav">
  <div class="nav-inner">
    <a href="#" class="brandmark">DJ <span>ROUGE</span></a>
    <nav class="links" id="navLinks">
      <a href="#bio" data-i18n="nav_bio"></a>
      <a href="#genres" data-i18n="nav_genres"></a>
      <a href="#events" data-i18n="nav_events"></a>
      <a href="#dates" data-i18n="nav_dates"></a>
      <a href="#mixes" data-i18n="nav_mixes"></a>
      <a href="#contact" class="book-btn" data-i18n="nav_book"></a>
    </nav>
    <div class="lang-switch" id="langSwitch">
      <button data-lang="it">IT</button>
      <button data-lang="en">EN</button>
      <button data-lang="fr">FR</button>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
  </div>
</header>

<section class="hero">
  <div class="wrap hero-grid">
    <div>
      <span class="eyebrow" data-i18n="hero_eyebrow"></span>
      <h1 class="hero-title">DJ<br><em>Rouge</em></h1>
      <p class="hero-sub" data-i18n="hero_sub"></p>
      <div class="hero-cta">
        <a class="cta-primary" href="#contact" data-i18n="hero_cta1"></a>
        <a class="cta-secondary" href="#events" data-i18n="hero_cta2"></a>
      </div>
    </div>
    <div class="hero-visual">
      <div class="disc">
        <svg viewBox="0 0 300 300">
          <circle cx="150" cy="150" r="148" fill="#3B2A18" stroke="#5A4530" stroke-width="1"/>
          <circle cx="150" cy="150" r="120" fill="none" stroke="#5A4530" stroke-width="1"/>
          <circle cx="150" cy="150" r="98" fill="none" stroke="#5A4530" stroke-width="1"/>
          <circle cx="150" cy="150" r="76" fill="none" stroke="#5A4530" stroke-width="1"/>
          <circle cx="150" cy="150" r="60" fill="#E23C22"/>
          <circle cx="150" cy="150" r="60" fill="url(#g)" opacity="0.4"/>
          <circle cx="150" cy="150" r="10" fill="#FAF3E6"/>
          <defs>
            <radialGradient id="g" cx="35%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
              <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
            </radialGradient>
          </defs>
        </svg>
      </div>
    </div>
  </div>

  <div class="ticker-wrap">
    <div class="ticker" id="ticker"></div>
  </div>
</section>

  <div class="wrap bio-grid">

let currentLang = 'it';

function render(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  const t = I18N[lang];

  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.textContent = t[key];
  });

  document.getElementById('ticker').innerHTML =
    t.ticker.concat(t.ticker).map(x=>`<span><b>${x}</b></span>`).join('');

  document.getElementById('genreFlow').innerHTML =
    t.genres.map((g,i)=>`<span class="genre-pill${i===0?' strong':''}">${g}</span>`).join('');

  document.getElementById('eventList').innerHTML =
    t.events.map(e=>`<div class="event-row"><div><span class="tag">${e.tag}</span></div><div><h3>${e.title}</h3><p>${e.desc}</p></div></div>`).join('');

  document.getElementById('dateList').innerHTML =
    t.dates.map((d,i)=>`<div class="date-row${i===0?' next':''}" ${i===0?`data-next-label="${t.dates_next}"`:''}><div class="date-badge">${d.badge}</div><div class="date-info"><h4>${d.venue}</h4><span>${d.type}</span></div></div>`).join('');

  document.getElementById('mixList').innerHTML =
    t.mixes.map(m=>`<a class="mix-row" href="#"><span class="play-ring"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8V4z"/></svg></span><div><h4>${m.title}</h4><span>${m.desc}</span></div></a>`).join('');

  document.getElementById('contactTitle').innerHTML =
    `${t.contact_pre} <span class="accent">${t.contact_accent}</span> ${t.contact_post}`;

  document.querySelectorAll('.lang-switch button').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-lang')===lang);
  });
}

document.getElementById('langSwitch').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-lang]');
  if(!btn) return;
  render(btn.getAttribute('data-lang'));
});

const menuBtn = document.getElementById('menuBtn');
const navLinks = document.getElementById('navLinks');
menuBtn.addEventListener('click', ()=> navLinks.classList.toggle('open'));
navLinks.querySelectorAll('a').forEach(a=> a.addEventListener('click', ()=> navLinks.classList.remove('open')));

render('it');
</script>
